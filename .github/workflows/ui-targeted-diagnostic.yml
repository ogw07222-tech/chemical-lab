name: UI targeted diagnostic

on:
  push:
    branches:
      - diagnostic/ui-targeted-d287239
  workflow_dispatch:

jobs:
  capture-laboratory-workspace-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: d28723987b43c257092a6591c510ef26f8b24fd4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare diagnostics directory
        run: mkdir -p diagnostics

      - name: Capture catalog collapse failure
        shell: bash
        run: |
          set +e
          npm test -- tests/ui/LaboratoryWorkspace.test.tsx -t "collapses and restores the catalog without losing access state" > diagnostics/catalog-collapse.txt 2>&1
          code=$?
          printf '%s\n' "$code" > diagnostics/catalog-collapse.exit
          exit 0

      - name: Capture finite mol add failure
        shell: bash
        run: |
          set +e
          npm test -- tests/ui/LaboratoryWorkspace.test.tsx -t "adds a finite mol amount through the provider" > diagnostics/add-finite-mol.txt 2>&1
          code=$?
          printf '%s\n' "$code" > diagnostics/add-finite-mol.exit
          exit 0

      - name: Capture disposal failure
        shell: bash
        run: |
          set +e
          npm test -- tests/ui/LaboratoryWorkspace.test.tsx -t "disposes selected vessel material only through provider command" > diagnostics/dispose-material.txt 2>&1
          code=$?
          printf '%s\n' "$code" > diagnostics/dispose-material.exit
          exit 0

      - name: Upload Vitest failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-vitest-failure-diagnostics
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
