name: Phase 4A-3 Runtime Blocking Thermal Fix

on:
  push:
    branches:
      - fix/phase4a3-runtime-blocking-thermal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Exact thermal defect reproduction
        run: npx vitest run tests/phase4a3-runtime-blocking-regression.test.ts
