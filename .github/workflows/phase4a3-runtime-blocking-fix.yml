name: Phase 4A-3 Runtime Blocking Thermal Fix

on:
  push:
    branches:
      - fix/phase4a3-runtime-blocking-thermal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Exact runtime-blocking thermal regression
        run: npx vitest run tests/phase4a3-runtime-blocking-regression.test.ts
      - name: Phase 4A-3 and 06D regressions
        run: npx vitest run tests/phase4a3-thermal-apparatus.test.ts tests/phase4a3-06d-defect-regression.test.ts tests/thermal.test.ts
      - name: Reaction thermal coupling and Phase 3
        run: npx vitest run tests/reaction-progression.test.ts tests/phase3a-dimensioned-resolver.test.ts tests/phase3a-kinetics-thermal.test.ts tests/phase3a-reaction-network.test.ts tests/phase3b-equilibrium.test.ts tests/phase3b-equilibrium-progression.test.ts tests/phase3b-reversible-arbitration.test.ts
      - name: Phase 4A-1 and Phase 4A-2
        run: npx vitest run tests/phase4a1-compartment-foundation.test.ts tests/phase4a2-gas-transport.test.ts tests/phase4a2-gas-transport-defect-regression.test.ts
      - name: Dynamic Species Registry
        run: npx vitest run tests/dynamic-species-registry.test.ts tests/dynamic-species-registry.validation.test.ts tests/generated-species-reference-enrichment.test.ts
      - run: npm test
      - run: npm run build
      - run: git rev-parse HEAD
