name: Particle Matter UI Validation

on:
  push:
    branches:
      - feature/05c-particle-matter-visualization

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { echo '### Temporary particle typecheck failure'; echo '```text'; tail -n 160 /tmp/typecheck.log; echo '```'; } > /tmp/comment.md
            gh pr comment 66 --body-file /tmp/comment.md
            exit "$status"
          fi
      - name: Lint
        run: npm run lint
      - name: Targeted particle tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm test -- tests/ui/chemistry/ParticleMatterVisualization.test.ts 2>&1 | tee /tmp/particle-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { echo '### Temporary particle validation failure'; echo '```text'; tail -n 180 /tmp/particle-tests.log; echo '```'; } > /tmp/comment.md
            gh pr comment 66 --body-file /tmp/comment.md
            exit "$status"
          fi
      - name: Existing UI regression
        run: npm test -- tests/ui/LaboratoryWorkspace.test.tsx tests/ui/workbench/WorkbenchPlacementSurface.test.tsx
      - name: Phase 3 regression
        run: npm test -- tests/phase3a-reaction-network.test.ts tests/ui/reactionProjection.test.tsx
      - name: Full suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/chemical-lab-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173 >/dev/null
          npm run smoke:ui
      - name: Tested commit
        run: git rev-parse HEAD
