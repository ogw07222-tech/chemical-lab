name: 07 Unified Phase4A UI Integration Validation

on:
  push:
    branches:
      - integration/phase4a-ui-stack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

      - name: UI coexistence static gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q "EquilibriumDetails" src/ui/App.tsx
          grep -q "MatterParticleCanvas" src/ui/App.tsx
          grep -q "projectPhase3BReactionUi" src/ui/reactionProjection.ts
          grep -q "visualizationKey" src/ui/reactionProjection.ts
          grep -q "EquilibriumPresentationView" src/ui/types.ts
          grep -q "visualizationKey" src/ui/types.ts
          ! grep -RInE 'Math\.random|Avogadro|6\.022|Navier|momentum|intermolecular|collision physics' src/ui/chemistry/matter
          ! grep -RInE 'amountMol[[:space:]]*/|pressurePa[[:space:]]*[=+*/-]|temperatureK[[:space:]]*[=+*/-]' src/ui/chemistry/matter

      - name: Targeted UI stack
        run: npm test -- tests/ui/chemistry/Phase3BEquilibriumVisualization.test.tsx tests/ui/chemistry/ParticleMatterVisualization.test.ts tests/ui/LaboratoryWorkspace.test.tsx tests/ui/workbench/WorkbenchPlacementSurface.test.tsx tests/ui/apparatus/ApparatusUi.test.tsx tests/ui/apparatus-accessibility.test.tsx tests/ui/apparatus-provider.test.tsx

      - name: Import 06C and 06B validation-only tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin validation/06c-particle-ui validation/06b-phase4a2-gas-transport
          mkdir -p tests/validation tools
          git show 11c63ed5f5838722105387ebad883ec0b55fdad0:tests/validation/06c-particle-ui-validation.test.ts > tests/validation/06c-particle-ui-validation.test.ts
          git show 11c63ed5f5838722105387ebad883ec0b55fdad0:tests/validation/06c-particle-browser-fixture.html > tests/validation/06c-particle-browser-fixture.html
          git show 11c63ed5f5838722105387ebad883ec0b55fdad0:tests/validation/06c-particle-browser-fixture.tsx > tests/validation/06c-particle-browser-fixture.tsx
          git show 11c63ed5f5838722105387ebad883ec0b55fdad0:tools/06c-particle-ui-smoke.mjs > tools/06c-particle-ui-smoke.mjs
          git show 892e5fb6610c338f3bee8cde112904464ba2a071:tests/validation/phase4a2-06b-independent.test.ts > tests/validation/phase4a2-06b-independent.test.ts
          git show 892e5fb6610c338f3bee8cde112904464ba2a071:tests/validation/phase4a2-06b-combined-large-dt.test.ts > tests/validation/phase4a2-06b-combined-large-dt.test.ts
          git show 892e5fb6610c338f3bee8cde112904464ba2a071:tests/validation/phase4a2-06b-longrun-performance.test.ts > tests/validation/phase4a2-06b-longrun-performance.test.ts

      - name: Independent UI / gas regressions
        run: npm test -- tests/validation/06c-particle-ui-validation.test.ts tests/validation/phase4a2-06b-independent.test.ts tests/validation/phase4a2-06b-combined-large-dt.test.ts tests/validation/phase4a2-06b-longrun-performance.test.ts

      - name: Phase 4A stack
        run: npm test -- tests/phase4a1-compartment-foundation.test.ts tests/phase4a2-gas-transport.test.ts tests/phase4a2-gas-transport-defect-regression.test.ts tests/phase4a3-thermal-apparatus.test.ts tests/phase4a3-06d-defect-regression.test.ts tests/thermal.test.ts

      - name: Phase 3 and registry
        run: npm test -- tests/phase3a-reaction-network.test.ts tests/phase3a-kinetics-thermal.test.ts tests/phase3b-equilibrium.test.ts tests/phase3b-equilibrium-progression.test.ts tests/phase3b-reversible-arbitration.test.ts tests/reaction-progression.test.ts tests/dynamic-species-registry.test.ts tests/game/generatedSpeciesKnowledge.test.ts

      - name: Gas thermal authority static gate
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn "gas-transport" src/simulation/thermal
          ! grep -RIn "thermal/apparatus" src/simulation/gas-transport

      - name: Full suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Repository responsive smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/repo-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173 >/dev/null
          npm run smoke:ui
      - name: 06C particle browser smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4174 > /tmp/06c-vite.log 2>&1 &
          DEV_PID=$!
          trap 'kill $DEV_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174 >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4174 >/dev/null
          UI_BASE_URL=http://127.0.0.1:4174 node tools/06c-particle-ui-smoke.mjs
      - name: Exact tested commit
        run: git rev-parse HEAD
