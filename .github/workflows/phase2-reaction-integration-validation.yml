name: Phase 2 Reaction Integration Validation

on:
  push:
    branches:
      - integration/phase2-reaction-foundation
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Molecular core regression
        run: npm test -- tests/molecular-core.test.ts
      - name: Chemistry data tests
        run: npm test -- tests/chemistry-data-pack.test.ts
      - name: Reaction candidate tests
        run: npm test -- tests/reaction-candidate.test.ts
      - name: Reaction evaluation tests
        run: npm test -- tests/reaction-evaluation.test.ts
      - name: Reaction validation matrix tests
        run: npm test -- tests/reaction-validation.matrix.test.ts
      - name: Phase 2 end-to-end integration proof
        run: npm test -- tests/phase2-reaction-integration.test.ts
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Tested commit
        run: git rev-parse HEAD
