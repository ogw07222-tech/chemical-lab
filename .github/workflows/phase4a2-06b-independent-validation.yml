name: Phase 4A-2 06B independent validation

on:
  push:
    branches:
      - validation/06b-phase4a2-gas-transport
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: 06B independent adversarial validation
        run: npx vitest run tests/validation/phase4a2-06b-independent.test.ts
      - name: Phase 4A-2 targeted
        run: npx vitest run tests/phase4a2-gas-transport.test.ts
      - name: Phase 4A-1 regression
        run: npx vitest run tests/phase4a1-compartment-foundation.test.ts
      - name: Phase 3A regression
        run: npx vitest run tests/phase3a-kinetics-thermal.test.ts
      - name: Phase 3B regression
        run: npx vitest run tests/phase3b-equilibrium.test.ts tests/phase3b-equilibrium-progression.test.ts tests/phase3b-reversible-arbitration.test.ts
      - name: Dynamic Species Registry regression
        run: npx vitest run tests/dynamic-species-registry.test.ts
      - name: Thermal regression
        run: npx vitest run tests/thermal.test.ts
      - name: Full suite
        run: npm test
      - name: Build
        run: npm run build
