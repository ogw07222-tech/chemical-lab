name: 07 05D Integration Validation
on:
  push:
    branches:
      - feature/05d-apparatus-provider-accessibility
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: 05A + 05B + 05D + Phase3 preservation regression
        run: npm test -- tests/ui/apparatus-provider.test.tsx tests/ui/apparatus-accessibility.test.tsx tests/ui/apparatus/ApparatusUi.test.tsx tests/ui/workbench/WorkbenchPlacementSurface.test.tsx tests/ui/LaboratoryWorkspace.test.tsx tests/phase3a-reaction-network.test.ts tests/phase3a-kinetics-thermal.test.ts tests/phase3b-equilibrium.test.ts tests/phase3b-reversible-arbitration.test.ts tests/dynamic-species-registry.test.ts tests/generated-species-reference-enrichment.test.ts tests/game/generatedSpeciesKnowledge.test.ts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Responsive smoke
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/07-05d-vite.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173 >/dev/null
          npm run smoke:ui
      - run: echo "TESTED_SHA=$GITHUB_SHA"
