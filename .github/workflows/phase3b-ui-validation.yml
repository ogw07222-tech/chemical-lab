name: Phase 3B UI Validation

on:
  push:
    branches:
      - feature/05c-phase3b-visualization

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Targeted 05C tests
        run: npm test -- tests/ui/chemistry/Phase3BEquilibriumVisualization.test.tsx
      - name: Existing UI regression
        run: npm test -- tests/ui/LaboratoryWorkspace.test.tsx
      - name: Phase 3B provider regression
        run: npm test -- tests/phase3b-equilibrium.test.ts tests/phase3b-equilibrium-progression.test.ts tests/phase3b-reversible-arbitration.test.ts
      - name: Full suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/chemical-lab-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173 >/dev/null
          npm run smoke:ui
      - name: Tested commit
        run: git rev-parse HEAD
