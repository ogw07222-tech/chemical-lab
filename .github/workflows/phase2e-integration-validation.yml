name: Phase 2E Integration Validation

on:
  push:
    branches:
      - feature/phase2e-reaction-state-progression

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Targeted Phase 2E and dependencies
        run: npm test -- tests/reaction-progression.test.ts tests/reaction-candidate.test.ts tests/reaction-evaluation.test.ts tests/thermal.test.ts
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Record tested commit
        run: echo "TESTED_SHA=$GITHUB_SHA"
