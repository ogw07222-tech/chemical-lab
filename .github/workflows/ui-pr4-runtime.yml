name: Diagnose PR4 Targeted UI Failure

on:
  push:
    branches:
      - diagnostic/pr4-targeted-9a1ba557

permissions:
  contents: read

jobs:
  diagnose-targeted-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head under diagnosis
        uses: actions/checkout@v4
        with:
          ref: 9a1ba5571417605df4ea903f31717bc0d70b4044

      - name: Verify exact source HEAD
        run: |
          test "$(git rev-parse HEAD)" = "9a1ba5571417605df4ea903f31717bc0d70b4044"
          git rev-parse HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reproducible install
        run: npm ci --no-audit --no-fund

      - name: Exact targeted UI test
        id: targeted
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- tests/ui/LaboratoryWorkspace.test.tsx 2>&1 | tee targeted-ui-output.txt

      - name: Preserve exact targeted output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-ui-output-9a1ba557
          path: targeted-ui-output.txt
          if-no-files-found: error

      - name: Preserve targeted result
        if: steps.targeted.outcome == 'failure'
        run: exit 1
