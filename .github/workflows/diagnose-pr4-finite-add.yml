name: Diagnose PR4 finite add

on:
  push:
    branches:
      - diagnostic/pr4-finite-add-4e458264

permissions:
  contents: read

jobs:
  desktop-finite-add:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 45cd2b23debff583ef49eb9ebfdf477395261b3d
      - name: Verify exact HEAD
        run: test "$(git rev-parse HEAD)" = "45cd2b23debff583ef49eb9ebfdf477395261b3d"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Desktop finite-add smoke only
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/chemical-lab-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const { chromium } = await import('playwright');
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const consoleErrors = [];
          page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
          page.on('pageerror', e => consoleErrors.push(e.message));
          await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
          const amount = page.getByLabel('Amount');
          const add = page.getByRole('button', { name: /Add H₂ to vessel/i });
          const before = {
            amountValue: await amount.inputValue(),
            buttonDisabled: await add.isDisabled(),
            compositionRows: await page.locator('.analysis-content tbody tr').allInnerTexts(),
          };
          if (before.amountValue !== '0.25') throw new Error(`desktop targeted: expected 0.25 mol input, got ${before.amountValue}`);
          if (before.buttonDisabled) throw new Error('desktop targeted: add button disabled');
          await add.click();
          const after = {
            compositionRows: await page.locator('.analysis-content tbody tr').allInnerTexts(),
            vesselChips: await page.locator('.composition-chip').allInnerTexts(),
          };
          const compositionOK = after.compositionRows.some(row => row.includes('H₂') && row.includes('unknown') && row.includes('0.250 mol'));
          const vesselOK = after.vesselChips.some(chip => chip.includes('H₂') && chip.includes('0.250 mol'));
          if (!compositionOK || !vesselOK) throw new Error(`desktop targeted: finite add projection missing ${JSON.stringify(after)}`);
          if (consoleErrors.length) throw new Error(`desktop targeted: console errors ${consoleErrors.join(' | ')}`);
          console.log(JSON.stringify({ before, after, consoleErrors }, null, 2));
          console.log('DESKTOP_FINITE_ADD_PASS');
          await browser.close();
          NODE
