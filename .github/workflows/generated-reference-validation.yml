name: Generated Species Reference Enrichment Validation

on:
  push:
    branches:
      - feature/generated-species-reference-enrichment

permissions:
  contents: read

jobs:
  validate-reference-enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Targeted generated-species reference tests
        run: npm test -- tests/generated-species-reference-enrichment.test.ts

      - name: Full test suite
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Tested commit
        run: git rev-parse HEAD
