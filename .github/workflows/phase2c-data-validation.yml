name: Phase 2C Chemistry Data Validation

on:
  push:
    branches:
      - feature/phase2-chemistry-data-pack

permissions:
  contents: read

jobs:
  validate-data-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Targeted chemistry data tests
        run: npm test -- tests/chemistry-data-pack.test.ts

      - name: Full test suite
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Tested commit
        run: git rev-parse HEAD
