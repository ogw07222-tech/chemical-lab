name: 07 Phase 4A-1 Integration Validation
on:
  push:
    branches:
      - feature/phase4a1-compartment-foundation
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Phase 4A-1 targeted regression
        run: npm test -- tests/phase4a1-compartment-foundation.test.ts
      - name: Import exact 06A independent validation tests
        run: |
          mkdir -p tests/validation
          git show 320c457c55503bad1f2523f311d82a5c6701d25e:tests/validation/phase4a1-06a-independent.test.ts > tests/validation/phase4a1-06a-independent.test.ts
          git show 320c457c55503bad1f2523f311d82a5c6701d25e:tests/validation/phase4a1-06a-extended.test.ts > tests/validation/phase4a1-06a-extended.test.ts
      - name: 06A independent regression
        run: npm test -- tests/validation/phase4a1-06a-independent.test.ts tests/validation/phase4a1-06a-extended.test.ts
      - name: Cross-phase regression
        run: npm test -- tests/phase3a-reaction-network.test.ts tests/phase3a-kinetics-thermal.test.ts tests/phase3b-equilibrium.test.ts tests/phase3b-reversible-arbitration.test.ts tests/dynamic-species-registry.test.ts tests/reaction-progression.test.ts tests/thermal.test.ts
      - run: npm test
      - run: npm run build
      - run: echo "TESTED_SHA=$GITHUB_SHA"
