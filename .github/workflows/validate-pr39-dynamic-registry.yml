name: Validate PR39 Dynamic Species Registry

on:
  push:
    branches:
      - validation/06-pr39-dynamic-species

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Prepare logs
        run: mkdir -p validation-logs

      - name: Typecheck
        run: npm run typecheck 2>&1 | tee validation-logs/typecheck.log

      - name: Lint
        run: npm run lint 2>&1 | tee validation-logs/lint.log

      - name: Independent dynamic registry validation
        run: npm test -- tests/validation.dynamic-species-registry.pr39.test.ts 2>&1 | tee validation-logs/independent.log

      - name: Production dynamic registry tests
        run: npm test -- tests/dynamic-species-registry.test.ts 2>&1 | tee validation-logs/production-registry.log

      - name: Reaction progression regression
        run: npm test -- tests/reaction-progression.test.ts 2>&1 | tee validation-logs/reaction-progression.log

      - name: Full test suite
        run: npm test 2>&1 | tee validation-logs/full-test.log

      - name: Build
        run: npm run build 2>&1 | tee validation-logs/build.log

      - name: Tested commit
        run: git rev-parse HEAD | tee validation-logs/tested-commit.txt

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr39-validation-logs
          path: validation-logs
