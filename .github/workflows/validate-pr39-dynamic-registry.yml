name: Validate PR39 Dynamic Species Registry

on:
  push:
    branches:
      - validation/06-pr39-dynamic-species

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Independent dynamic registry validation
        run: npm test -- tests/validation.dynamic-species-registry.pr39.test.ts

      - name: Production dynamic registry tests
        run: npm test -- tests/dynamic-species-registry.test.ts

      - name: Reaction progression regression
        run: npm test -- tests/reaction-progression.test.ts

      - name: Full test suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Tested commit
        run: git rev-parse HEAD
