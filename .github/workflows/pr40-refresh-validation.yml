name: PR40 Refreshed Reference Validation

on:
  push:
    branches:
      - feature/generated-species-reference-enrichment

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Targeted reference matching
        run: npm test -- tests/generated-species-reference-enrichment.test.ts tests/dynamic-species-registry.test.ts
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Record tested commit
        run: echo "TESTED_SHA=$GITHUB_SHA"
