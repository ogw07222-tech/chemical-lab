name: Dynamic Species Registry Validation

on:
  push:
    branches:
      - feature/dynamic-species-registry

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reproducible install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Targeted simulation tests
        run: npm test -- tests/dynamic-species-registry.test.ts tests/reaction-progression.test.ts tests/reaction-candidate.test.ts tests/reaction-evaluation.test.ts tests/thermal.test.ts

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Tested commit
        run: git rev-parse HEAD
