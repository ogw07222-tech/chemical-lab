name: Phase 4A-2 defect fix validation

on:
  push:
    branches:
      - feature/phase4a2-gas-transport

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Phase 4A-2 targeted and defect regressions
        run: npx vitest run tests/phase4a2-gas-transport.test.ts tests/phase4a2-gas-transport-defect-regression.test.ts
      - name: Phase 4A-1 regression
        run: npx vitest run tests/phase4a1-compartment-foundation.test.ts
      - name: Phase 3A kinetics and thermal regression
        run: npx vitest run tests/phase3a-kinetics-thermal.test.ts
      - name: Phase 3B equilibrium regression
        run: npx vitest run tests/phase3b-equilibrium.test.ts
      - name: Phase 3B progression regression
        run: npx vitest run tests/phase3b-equilibrium-progression.test.ts
      - name: Phase 3B reversible arbitration regression
        run: npx vitest run tests/phase3b-reversible-arbitration.test.ts
      - name: Dynamic Species Registry regression
        run: npx vitest run tests/dynamic-species-registry.test.ts
      - name: Thermal regression
        run: npx vitest run tests/thermal.test.ts
      - name: Full suite
        run: npm test -- --run
      - name: Build
        run: npm run build
